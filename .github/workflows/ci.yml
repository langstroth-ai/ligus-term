name: CI

# Third-party actions are pinned by commit SHA (the comment is the tag),
# the same SHAs the ligus repo uses.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      # insta never writes snapshots in CI; a changed screen fails the run.
      - run: cargo test --locked
      - run: cargo run --locked -- --version
      # The mock relay and the test passkey never reach a shipped binary.
      - run: scripts/check-no-test-relay.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  # Builds lt for every target release.yml ships, through the same action,
  # so a target that stops building (say, a Ligus crate that no longer
  # builds for musl) fails here instead of in a release.
  targets:
    strategy:
      fail-fast: false
      # Must match release.yml's build matrix
      # (scripts/test-release-workflow.rb checks it).
      matrix:
        include:
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-latest
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build lt
        uses: ./.github/actions/build-lt
        with:
          target: ${{ matrix.target }}
          profile: debug
          save-cache: ${{ github.ref == 'refs/heads/main' }}

  # The release pipeline's own tests: the workflows' shape (draft until
  # complete, publish gating, the formula after publish, the targets), the
  # asset and version checks, and the race-free tap push.
  release-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ruby scripts/test-release-workflow.rb
      - run: bash scripts/test-tap-push.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh

  # The one required check: passes only when every job above passed.
  # cut-release.yml refuses a commit without it.
  ci-ok:
    if: always()
    needs: [fmt, clippy-and-test, deny, targets, release-tooling]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
