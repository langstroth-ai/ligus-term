[package]
name = "ligus-term"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "lt: a full Ligus client in the terminal (Ligus is short for ligustica)"
license = "MIT"
repository = "https://github.com/langstroth-ai/ligus-term"
readme = "README.md"
keywords = ["ligus", "tui", "terminal", "e2ee", "agents"]
categories = ["command-line-utilities"]
default-run = "lt"

[[bin]]
name = "lt"
path = "src/main.rs"

[lib]
name = "ligus_term"
path = "src/lib.rs"

# Direct dependencies are pinned to releases that were at least 7 days old
# when chosen (see AGENTS.md, "Dependencies").
[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.31"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net"] }
toml = "1.1.8"
unicode-width = "0.2.2"
uuid = { version = "1.29.1", features = ["v4"] }
serde_json = "1.0.154"
# The Ligus crates (Ligus is short for ligustica), under their current
# names. For now a path dependency on a local worktree of the ligus repo
# (branch feat/runtime-for-clients). At release, after the rename to
# ligus-*, switch to git dependencies pinned to the release tag:
#   ligus-core    = { git = "https://github.com/langstroth-ai/ligus", tag = "v0.1.0" }
#   ligus-runtime = { git = "https://github.com/langstroth-ai/ligus", tag = "v0.1.0" }
# (and allow that git source in deny.toml).
hive-core = { path = "../f-term-crates/crates/hive-core" }
hive-runtime = { path = "../f-term-crates/crates/hive-runtime", default-features = false }

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
# The in-process mock relay two test devices sync through.
hive-runtime = { path = "../f-term-crates/crates/hive-runtime", default-features = false, features = ["test-relay"] }
axum = "0.8.9"

[profile.release]
lto = "thin"
strip = true
