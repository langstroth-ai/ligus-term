[package]
name = "ligus-term"
version = "0.4.1"
edition = "2024"
rust-version = "1.91"
description = "lt: a full Ligus client in the terminal (Ligus is short for ligustica)"
license = "MIT"
repository = "https://github.com/langstroth-ai/ligus-term"
readme = "README.md"
keywords = ["ligus", "tui", "terminal", "e2ee", "agents"]
categories = ["command-line-utilities"]
default-run = "lt"

[[bin]]
name = "lt"
path = "src/main.rs"

[lib]
name = "ligus_term"
path = "src/lib.rs"

# Direct dependencies are pinned to releases that were at least 7 days old
# when chosen (see AGENTS.md, "Dependencies").
[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.31"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "net"] }
toml = "1.1.8"
unicode-width = "0.2.2"
uuid = { version = "1.29.1", features = ["v4"] }
serde_json = "1.0.154"
zeroize = "1.9.1"
# The Ligus crates (Ligus is short for ligustica), pinned to an exact
# commit of the ligus repo (it has the passkey hand-off: the terminal asks
# the person's desktop or phone to confirm; one link brings all the
# person's workspaces; and the dispatch outcome: where a waiting turn is,
# and how a reply ended). Move this to the ligus 0.5 release tag
# before lt is released.
ligus-core = { version = "0.4.1", git = "https://github.com/langstroth-ai/ligus", rev = "dd2f2d2674af407a7b498f2ffd95d7cabaccf96d" }
ligus-runtime = { version = "0.4.1", git = "https://github.com/langstroth-ai/ligus", rev = "dd2f2d2674af407a7b498f2ffd95d7cabaccf96d", default-features = false }

# poll(2) on stdin for the terminal's background colour (OSC 11).
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
insta = "1.48.0"
tempfile = "3.27.0"
# The in-process mock relay two test devices sync through (the same commit
# as above).
ligus-runtime = { version = "0.4.1", git = "https://github.com/langstroth-ai/ligus", rev = "dd2f2d2674af407a7b498f2ffd95d7cabaccf96d", default-features = false, features = ["test-relay"] }
axum = "0.8.9"

[profile.release]
lto = "thin"
strip = true
