# cargo-deny: licenses, advisories, bans and sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# The Ligus crates' own exception, with their reasoning (ligus deny.toml):
# crypto-bigint 0.5 is reached only through ssh-key 0.6 SSHSIG verification
# (public inputs, no secret to leak); fixed in ssh-key 0.7, still an rc.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 only via ssh-key 0.6 SSHSIG verification in ligus-runtime (public inputs); review by 2027-02-15" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # option-ext (through dirs): file-level copyleft, unmodified, fine in an MIT binary.
    "MPL-2.0",
    # Through the Ligus crates, as the ligus repo allows them: bip39 and the
    # bitcoin_hashes stack (recovery words) are CC0, and the Mozilla root
    # store (webpki-root-certs, via reqwest/rustls) is CDLA-Permissive-2.0.
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
# The Ligus git dependencies carry a version too (0.1.0), so none is a wildcard.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The Ligus crates, pinned to a commit (later the v0.1.0 tag) of their repo.
allow-git = ["https://github.com/langstroth-ai/ligus"]
