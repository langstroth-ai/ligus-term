# cargo-deny: licenses, advisories, bans and sources.
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # option-ext (through dirs): file-level copyleft, unmodified, fine in an MIT binary.
    "MPL-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# When the Ligus crates are wired in, allow their release repo here:
# allow-git = ["https://github.com/langstroth-ai/ligus"]
